name: Build blog

# Rebuilds the Eleventy blog into docs/blog whenever the blog source changes,
# and commits the generated output. The site itself is served by the existing
# GitHub Pages "deploy from branch" setup (docs/ + CNAME) — this workflow only
# regenerates the static files under docs/blog, it does NOT change Pages config.
#
# Trigger is scoped to blog/** so the commit it makes (under docs/blog) never
# re-triggers the workflow. Safe to run manually via workflow_dispatch.

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - ".github/workflows/blog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1

      - run: npm install --global npm@12.0.2

      - name: Install + build blog
        working-directory: blog
        run: |
          npm ci
          npm run build

      - name: Commit regenerated blog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/blog = the built site; docs/sitemap.xml = root sitemap the
          # build regenerates (owned by this build, per the Kevin handoff).
          if [ -n "$(git status --porcelain docs/blog docs/sitemap.xml)" ]; then
            git add docs/blog docs/sitemap.xml
            git commit -m "chore(blog): rebuild static output [skip ci]"
            git push
          else
            echo "No blog changes to commit."
          fi
